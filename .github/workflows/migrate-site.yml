name: Replace experiment figures from supplied PDFs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-site.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install Pillow
      - name: Replace only experiment assets
        shell: python
        run: |
          from pathlib import Path
          import base64, zlib, subprocess, re
          from PIL import Image
          Path("assets/pdfs/ablation.pdf").write_bytes(zlib.decompress(base64.b64decode("")))
          Path("assets/pdfs/radar.pdf").write_bytes(zlib.decompress(base64.b64decode("")))
          Path("/tmp/cafe-figures").mkdir(exist_ok=True)
          for name in ("radar", "ablation"):
              subprocess.run(["pdftoppm", "-scale-to", "3000", "-png", f"assets/pdfs/{name}.pdf", f"/tmp/cafe-figures/{name}"], check=True)
          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          for name, source in [("radar", "radar-1"), ("ablation", "ablation-1"), ("ablation-strategy", "ablation-2")]:
              image = Image.open(f"/tmp/cafe-figures/{source}.png").convert("RGB")
              image.save(f"assets/figures/{name}.webp", lossless=True)
              pattern = r'(<img src="assets/figures/' + re.escape(name) + r'\.webp" width=")[0-9]+(" height=")[0-9]+(")'
              html, count = re.subn(pattern, lambda m: m[1]+str(image.width)+m[2]+str(image.height)+m[3], html)
              assert count == 1
          page.write_text(html, encoding="utf-8")
      - name: Commit replacement figures
        run: |
          git config user.name "submissionforpaper"
          git config user.email "270125933+submissionforpaper@users.noreply.github.com"
          git add assets/figures/radar.webp assets/figures/ablation.webp assets/figures/ablation-strategy.webp assets/pdfs/radar.pdf assets/pdfs/ablation.pdf index.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace three experiment figures with supplied PDF figures"
            git push origin HEAD:main
          fi
      - name: Publish latest homepage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
