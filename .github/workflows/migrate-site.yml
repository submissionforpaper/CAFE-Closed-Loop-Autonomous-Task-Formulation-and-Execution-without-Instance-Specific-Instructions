name: Migrate CAFE homepage

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-site.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
      - name: Check whether migration is needed
        id: migration
        run: |
          if [ -f index.html ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out original homepage
        if: steps.migration.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          repository: mingjia2005/CAFE-Closed-Loop-Autonomous-Task-Formulation-and-Execution-without-Explicit-Task-Input
          ref: 4c713cec67b2d14383433ef0b8de548613f754c6
          path: .migration-source
          persist-credentials: false
      - name: Copy homepage and update destination links
        if: steps.migration.outputs.needed == 'true'
        shell: python
        run: |
          from pathlib import Path
          import shutil
          source = Path(".migration-source")
          for item in source.iterdir():
              if item.name == ".git":
                  continue
              destination = Path(item.name)
              if item.is_dir():
                  shutil.copytree(item, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, destination)
          old_repo = "mingjia2005/CAFE-Closed-Loop-Autonomous-Task-Formulation-and-Execution-without-Explicit-Task-Input"
          new_repo = "submissionforpaper/CAFE-Closed-Loop-Autonomous-Task-Formulation-and-Execution-without-Instance-Specific-Instructions"
          old_site = "https://mingjia2005.github.io/CAFE-Closed-Loop-Autonomous-Task-Formulation-and-Execution-without-Explicit-Task-Input/"
          new_site = "https://submissionforpaper.github.io/CAFE-Closed-Loop-Autonomous-Task-Formulation-and-Execution-without-Instance-Specific-Instructions/"
          for name in ["index.html", "README.md", "robots.txt", "sitemap.xml"]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_site, new_site).replace("https://github.com/" + old_repo, "https://github.com/" + new_repo)
              path.write_text(text, encoding="utf-8")
          assert 'id="method"' in Path("index.html").read_text(encoding="utf-8")
          assert Path("assets/videos/CAFE.mp4").stat().st_size == 89835603
          assert Path(".nojekyll").is_file()
      - name: Save complete migrated homepage
        if: steps.migration.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll README.md assets index.html robots.txt site.css site.js sitemap.xml
          git commit -m "Migrate CAFE homepage and assets to submissionforpaper"
          git push origin HEAD:main
