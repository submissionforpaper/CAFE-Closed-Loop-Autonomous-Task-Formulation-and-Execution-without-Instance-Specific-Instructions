name: Finalize CAFE review materials

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-site.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install figure processing dependencies
        run: python -m pip install Pillow pypdf
      - name: Crop numbered figure headings
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader, PdfWriter
          import re
          specs = [("radar", 250, 2572), ("ablation", 143, 1350), ("ablation-strategy", 194, 1975)]
          for name, top, original_height in specs:
              path = Path("assets/figures") / (name + ".webp")
              original = Image.open(path).convert("RGB")
              if original.height == original_height:
                  crop = original.crop((0, top, original.width, original.height))
                  crop.save(path, format="WEBP", lossless=True)
                  assert Image.open(path).convert("RGB").tobytes() == crop.tobytes()
              else:
                  assert original.height == original_height - top
          pdf_specs = [("radar", [(84, 864)]), ("ablation", [(55, 518.4), (72, 734.4)])]
          for name, pages in pdf_specs:
              path = Path("assets/pdfs") / (name + ".pdf")
              reader = PdfReader(path)
              writer = PdfWriter()
              changed = False
              for page, (top, original_height) in zip(reader.pages, pages):
                  height = float(page.mediabox.height)
                  if abs(height - original_height) < 0.01:
                      right, upper = float(page.mediabox.right), float(page.mediabox.top)
                      page.mediabox.upper_right = (right, upper - top)
                      page.cropbox.lower_left = page.mediabox.lower_left
                      page.cropbox.upper_right = page.mediabox.upper_right
                      changed = True
                  else:
                      assert abs(height - (original_height - top)) < 0.01
                  writer.add_page(page)
              if changed:
                  temporary = path.with_suffix(".tmp.pdf")
                  with temporary.open("wb") as stream:
                      writer.write(stream)
                  temporary.replace(path)
          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          for name, top, height in specs:
              pattern = r'(<img src="assets/figures/' + re.escape(name) + r'\.webp" width="3000" height=")[0-9]+(")'
              html, count = re.subn(pattern, lambda m: m[1] + str(height - top) + m[2], html)
              assert count == 1
          page.write_text(html, encoding="utf-8")
      - name: Align paper title and anonymous project links
        shell: python
        run: |
          from pathlib import Path
          import re
          from html.parser import HTMLParser
          title = "CAFE: Closed-Loop Autonomous Task Formulation and Execution without Instance-Specific Instructions"
          repo_url = "https://github.com/submissionforpaper/CAFE-Closed-Loop-Autonomous-Task-Formulation-and-Execution-without-Instance-Specific-Instructions"
          site_url = "https://submissionforpaper.github.io/CAFE-Closed-Loop-Autonomous-Task-Formulation-and-Execution-without-Instance-Specific-Instructions/"
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = re.sub(r"^- \[(Source code directory|Local implementation guide)\].*\n", "", text, flags=re.M)
          text = re.sub(r"(\[Implementation repository\]\()[^)]+(\))", lambda m: m[1] + repo_url + m[2], text)
          readme.write_text(text, encoding="utf-8")
          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          html = html.replace("without Explicit Task Input", "without Instance-Specific Instructions")
          html = html.replace("without explicit task input", "without instance-specific instructions")
          html = re.sub(r"https://github\.com/submissionforpaper/[A-Za-z0-9_-]+", repo_url, html)
          html = re.sub(r"<title>[^<]*</title>", "<title>" + title + "</title>", html)
          html = re.sub(r'(<meta property="og:title" content=")[^"]*(">)', lambda m: m[1] + title + m[2], html)
          page.write_text(html, encoding="utf-8")
          guide = Path("CAFE/README.md")
          guide_text = guide.read_text(encoding="utf-8")
          guide_text = re.sub(r"^# CAFE Project Guide", "# " + title, guide_text, flags=re.M)
          guide.write_text(guide_text, encoding="utf-8")
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("href", "src", "content") and value and value.startswith(("http://", "https://")):
                          assert value.startswith((repo_url, site_url)), f"Unexpected external URL: {value}"
          Links().feed(html)
          assert len(re.findall(r"^- \[", text, flags=re.M)) == 2
          assert Path("CAFE/aithor2/main_with_depth.py").is_file()
          assert "without Explicit Task Input" not in html
      - name: Commit consistent review materials
        run: |
          git config user.name "submissionforpaper"
          git config user.email "270125933+submissionforpaper@users.noreply.github.com"
          git add README.md index.html CAFE/README.md assets/figures/radar.webp assets/figures/ablation.webp assets/figures/ablation-strategy.webp assets/pdfs/radar.pdf assets/pdfs/ablation.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Crop numbered headings from three experiment figures"
            git push origin HEAD:main
          fi
      - name: Publish latest homepage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
